<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#313338">
  <meta name="description" content="dogapp — бесплатный Discord: аккаунты, друзья, звонки, баннеры, эмоции серверов и кастомные ссылки.">
  <title>dogapp — общение без подписок</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ ЗАГРУЗКА ============ -->
  <div id="loader" class="loader">
    <div class="loader-blob"></div>
    <div class="loader-top">
      <img src="assets/logo.svg" alt="" class="loader-mark">
      <span>dogapp</span>
      <span class="loader-version">v2.0 · free forever</span>
    </div>
    <div class="loader-center">
      <div class="loader-logo">
        <img src="assets/logo.svg" alt="dogapp">
        <div class="loader-dots"><i></i><i></i><i></i></div>
      </div>
      <h1 class="loader-brand">dogapp</h1>
      <p class="loader-tagline">Общение без платных подписок</p>
      <div class="loader-status" id="loader-status">Проверяем обновления…</div>
      <div class="loader-bar"><span></span></div>
    </div>
    <div class="loader-tip">Подсказка: эмоции всех серверов бесплатны для вас и ваших друзей</div>
    <div class="loader-foot">
      <span>Чистый HTML, CSS и JavaScript</span>
      <span id="loader-conn">Подключение…</span>
    </div>
  </div>

  <!-- ============ ВХОД / РЕГИСТРАЦИЯ ============ -->
  <div id="auth-page" class="auth-page" hidden></div>

  <!-- ============ ЭКРАН ПРИГЛАШЕНИЯ ============ -->
  <div id="invite-page" class="invite-page" hidden></div>

  <!-- ============ ПРИЛОЖЕНИЕ ============ -->
  <div id="app" class="app" hidden>
    <nav class="rail" id="rail">
      <button id="rail-home" class="rail-btn rail-home" data-action="home" data-tip="Друзья и личные сообщения" aria-label="Друзья">
        <img src="assets/logo.svg" alt="">
      </button>
      <div class="rail-divider"></div>
      <div id="server-list" class="rail-servers"></div>
      <button class="rail-btn rail-add" data-action="create-server" data-tip="Создать сервер" aria-label="Создать сервер">
        <span class="rail-plus">+</span>
      </button>
      <button class="rail-btn" data-action="explore" data-tip="Найти серверы" aria-label="Найти серверы" id="rail-explore"></button>
      <div class="rail-divider"></div>
      <button class="rail-btn" data-action="my-invites" data-tip="Мои приглашения" aria-label="Мои приглашения" id="rail-link"></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" data-action="connection" data-tip="Подключение к Firebase" aria-label="Подключение" id="rail-cloud"></button>
      <button class="rail-btn" data-action="about" data-tip="О dogapp" aria-label="О dogapp" id="rail-info"></button>
    </nav>

    <aside class="sidebar">
      <div id="sidebar-head" class="sidebar-head"></div>
      <div id="channels" class="channels scroll"></div>
      <div id="voice-root"></div>
      <div id="user-panel" class="user-panel"></div>
    </aside>

    <main class="main">
      <header id="chat-header" class="chat-header"></header>
      <div class="content">
        <div class="chat-col">
          <div id="messages" class="messages scroll"></div>
          <div id="typing" class="typing"></div>
          <div id="composer" class="composer-wrap"></div>
        </div>
        <aside id="members" class="members scroll"></aside>
      </div>
    </main>
  </div>

  <!-- наложения -->
  <div id="call-root"></div>
  <div id="modal-root"></div>
  <div id="popout-root"></div>
  <div id="emoji-picker" class="emoji-picker" hidden></div>
  <div id="toast-root" class="toast-root"></div>
  <input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
